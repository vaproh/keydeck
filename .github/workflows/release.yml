name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Test
        run: go test ./...

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level=high
          pnpm build

      - name: Build binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/desk ./cmd/desk

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build VPS bundle
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p "release/bundle/web"
          cp -R web/build "release/bundle/web/build"
          cp dist/desk "release/bundle/desk"
          cp docker-compose.yml Caddyfile .env.example README.md LICENSE Dockerfile.release "release/bundle/"
          mv "release/bundle/Dockerfile.release" "release/bundle/Dockerfile"
          sed -i "s#ghcr.io/vaproh/license-desk:latest#ghcr.io/${GITHUB_REPOSITORY}:latest#" "release/bundle/docker-compose.yml"
          tar -C release/bundle -czf "release/license-desk-${version}-linux-amd64.tar.gz" .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/license-desk-*-linux-amd64.tar.gz
