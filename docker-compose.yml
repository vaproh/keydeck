services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: licensing
      POSTGRES_USER: licensing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  license-api:
    build: { context: .., dockerfile: license-server/Dockerfile }
    command: uvicorn lsapp.api_public:app --host 0.0.0.0 --port 8000
    environment:
      LICENSE_DB_URL: postgresql+psycopg://licensing:${POSTGRES_PASSWORD}@postgres:5432/licensing
      LICENSE_SIGNING_KEY_REORCHESTRA: ${LICENSE_SIGNING_KEY_REORCHESTRA:?set per-product license key}
      LICENSE_DOWNLOAD_SECRET: ${LICENSE_DOWNLOAD_SECRET}
      LICENSE_OFFLINE_GRACE_HOURS: "24"
      LICENSE_ARTIFACTS_DIR: /artifacts
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set the public license URL}
      LICENSE_REQUIRE_PUBLIC_URL: "1"
    volumes:
      - artifacts:/artifacts
    depends_on: [postgres]
    restart: unless-stopped

  license-admin:
    build: { context: .., dockerfile: license-server/Dockerfile }
    command: uvicorn lsapp.api_admin:app --host 0.0.0.0 --port 8000
    environment:
      LICENSE_DB_URL: postgresql+psycopg://licensing:${POSTGRES_PASSWORD}@postgres:5432/licensing
      LICENSE_SIGNING_KEY_REORCHESTRA: ${LICENSE_SIGNING_KEY_REORCHESTRA}
      UPDATE_SIGNING_KEY_REORCHESTRA: ${UPDATE_SIGNING_KEY_REORCHESTRA:?set per-product update key}
      LICENSE_ADMIN_PASSWORD_HASH: ${LICENSE_ADMIN_PASSWORD_HASH}
      LICENSE_ADMIN_TOTP_SECRET: ${LICENSE_ADMIN_TOTP_SECRET}
      ADMIN_SERVICE_TOKEN: ${ADMIN_SERVICE_TOKEN:?set CI service token}
      ADMIN_COOKIE_SECURE: "1"
      LICENSE_ARTIFACTS_DIR: /artifacts
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set the public license URL}
      LICENSE_REQUIRE_PUBLIC_URL: "1"
    volumes:
      - artifacts:/artifacts
    depends_on: [postgres]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [license-api, license-admin]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  artifacts:
