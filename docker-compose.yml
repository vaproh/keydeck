services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-license}
      POSTGRES_USER: ${POSTGRES_USER:-license}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  desk:
    image: ${DESK_IMAGE:-ghcr.io/vaproh/license-desk:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT_LICENSE: 8080
      PORT_OTA: 8081
      PORT_ADMIN: 8082
      DATABASE_URL: postgres://${POSTGRES_USER:-license}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-license}?sslmode=disable
    expose:
      - '8080'
      - '8081'
      - '8082'
    healthcheck:
      test: ['CMD', '/desk', 'healthcheck']
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      desk:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      LICENSE_DOMAIN: ${LICENSE_DOMAIN:?set LICENSE_DOMAIN}
      OTA_DOMAIN: ${OTA_DOMAIN:?set OTA_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
      ADMIN_ALLOW: ${ADMIN_ALLOW:?set ADMIN_ALLOW to your public IP or CIDR}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
