services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keydeck}
      POSTGRES_USER: ${POSTGRES_USER:-keydeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  keydeck:
    image: ${KEYDECK_IMAGE:-ghcr.io/vaproh/keydeck:latest}
    build: .
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT_LICENSE: 8080
      PORT_OTA: 8081
      PORT_ADMIN: 8082
      DATABASE_URL: postgres://${POSTGRES_USER:-keydeck}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-keydeck}?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL to the OTA https URL}
      ARTIFACTS_DIR: /data/artifacts
      SIGNING_KEYS_DIR: /data/keys
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?run keydeck passwd}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:?set ADMIN_TOTP_SECRET}
      ADMIN_ACTOR: ${ADMIN_ACTOR:-admin}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?set TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?set TURNSTILE_SECRET_KEY}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:?set TURNSTILE_EXPECTED_HOSTNAME}
      DOWNLOAD_SECRET: ${DOWNLOAD_SECRET:?set DOWNLOAD_SECRET}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:-}
    volumes:
      - artifacts:/data/artifacts
      - signing_keys:/data/keys
    expose:
      - '8080'
      - '8081'
      - '8082'
    healthcheck:
      test: ['CMD', '/keydeck', 'healthcheck']
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      keydeck:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      LICENSE_DOMAIN: ${LICENSE_DOMAIN:?set LICENSE_DOMAIN}
      OTA_DOMAIN: ${OTA_DOMAIN:?set OTA_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
      ADMIN_ALLOW: ${ADMIN_ALLOW:?set ADMIN_ALLOW to your public IP or CIDR}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    command: --interval 300 --cleanup --label-enable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"

volumes:
  pgdata:
  artifacts:
  signing_keys:
  caddy_data:
  caddy_config:
