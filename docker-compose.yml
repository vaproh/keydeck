services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: licensing
      POSTGRES_USER: licensing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  license-api:
    build: .
    command: uvicorn lsapp.api_public:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      LICENSE_DB_URL: postgresql+psycopg://licensing:${POSTGRES_PASSWORD}@postgres:5432/licensing
      LICENSE_ARTIFACTS_DIR: /artifacts
      LICENSE_REQUIRE_PUBLIC_URL: "1"
    volumes:
      - artifacts:/artifacts
    depends_on: [postgres]
    restart: unless-stopped

  license-admin:
    build: .
    command: uvicorn lsapp.api_admin:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      LICENSE_DB_URL: postgresql+psycopg://licensing:${POSTGRES_PASSWORD}@postgres:5432/licensing
      LICENSE_ARTIFACTS_DIR: /artifacts
      LICENSE_REQUIRE_PUBLIC_URL: "1"
      ADMIN_COOKIE_SECURE: "1"
    volumes:
      - artifacts:/artifacts
    depends_on: [postgres]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [license-api, license-admin]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  artifacts:
