{% extends "base.html" %}
{% block title %}Sign in · License admin{% endblock %}
{% block body %}
<div class="login">
  <h1>License admin</h1>
  {% if error %}<div class="banner">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login" style="display:grid; gap:12px">
    <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
    <label>Authenticator code<input name="totp" inputmode="numeric" pattern="[0-9]{6,8}" required /></label>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
